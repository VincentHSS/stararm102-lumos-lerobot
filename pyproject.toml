[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_lumos_stararm102"
version = "0.2.0"
description = "Lumos robot and StarArm102 teleoperator adapters for LeRobot"
requires-python = ">=3.12"
dependencies = ["lerobot[core_scripts]>=0.6.2,<0.7", "pyserial>=3.5,<4", "fashionstar-uart-sdk"]

[project.scripts]
lumos-lerobot = "lerobot_robot_lumos_stararm102.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
extend-exclude = ["_legacy.py", "test_follow_control.py", "stararm102_lumos_teleop.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
